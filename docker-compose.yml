version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mindlit-postgres
    restart: always
    environment:
      POSTGRES_USER: mindlit_user
      POSTGRES_PASSWORD: mindlit_password
      POSTGRES_DB: mindlit_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindlit_user -d mindlit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindlit-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: mindlit-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindlit-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://mindlit_user:mindlit_password@db:5432/mindlit_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=mindlit-documents
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - SECRET_KEY=production_secret_key_mindlit_secure_auth_token_987654321
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindlit-worker
    restart: always
    command: python -m app.services.background_worker
    environment:
      - DATABASE_URL=postgresql+psycopg2://mindlit_user:mindlit_password@db:5432/mindlit_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=mindlit-documents
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindlit-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
